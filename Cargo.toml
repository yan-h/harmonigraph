[workspace]
resolver = "2"
members = [
    "crates/harmonigraph-core",
    "crates/harmonigraph-scene",
    "crates/harmonigraph-render",
    "crates/harmonigraph-golden",
    "crates/harmonigraph-perf",
    "crates/harmonigraph-ui",
    "crates/harmonigraph-take",
    "crates/harmonigraph-record",
    "crates/harmonigraph-offline",
    "crates/harmonigraph-standalone",
    "crates/harmonigraph-plugin",
    "xtask",
]
# The vendored crates are their own workspaces, only referenced via [patch].
exclude = ["vendor/baseview", "vendor/egui-baseview", "vendor/nice-plug"]

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Yan Han"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal crates
harmonigraph-core = { path = "crates/harmonigraph-core" }
harmonigraph-scene = { path = "crates/harmonigraph-scene" }
harmonigraph-render = { path = "crates/harmonigraph-render" }
# Dev-only: the byte-exact frame gate, shared by every crate that keeps a set.
harmonigraph-golden = { path = "crates/harmonigraph-golden" }
harmonigraph-perf = { path = "crates/harmonigraph-perf" }
harmonigraph-ui = { path = "crates/harmonigraph-ui" }
harmonigraph-take = { path = "crates/harmonigraph-take" }
harmonigraph-record = { path = "crates/harmonigraph-record" }

# GUI stack. These versions are coupled:
#   egui-baseview 0.3 -> egui 0.35 / egui-wgpu 0.35 / wgpu 29 / baseview 0.1
#   eframe must match egui, egui_dock 0.20 -> egui 0.35
# When bumping egui, bump all of these together.
egui = "0.35"
egui-wgpu = "0.35"
eframe = { version = "0.35", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
    "persistence",
] }
egui_dock = { version = "0.20", features = ["serde"] }
egui-baseview = { version = "0.3", default-features = false, features = [
    "wgpu",
    # Required when default features are off: the crate's log macros come
    # from either `tracing` or `nice-log`.
    "tracing",
] }
# Patched below ([patch.crates-io]) with the macOS run-loop fix; see PATCHES.md.
baseview = "0.1.4"

# Plugin framework: the community continuation of nih-plug. Host->plugin
# window resizing is supported natively (ResizeHint / Editor::set_size).
nice-plug = "0.1.10"
nice-plug-xtask = "0.1.1"

# Math / utility
glam = { version = "0.33", features = ["serde"] }
# LCH color math, same crate v1 used so channel colors match exactly.
color_space = "0.5"
# Shader validation for hot-reload (dev only); version tracks wgpu's.
naga = "29"
bytemuck = { version = "1", features = ["derive"] }
rtrb = "0.3"
crossbeam = "0.8"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
# Persist format: RON round-trips NaN/inf floats (fresh egui_dock layout
# rects are NaN; JSON turns them into null and fails to restore).
ron = "0.12"
# Hardware MIDI input for the standalone dev harness.
midir = "0.11"
raw-window-handle = "0.5"

# Vendored crates with small fixes (see PATCHES.md; both worth upstreaming):
# - baseview 0.1.4: macOS frame timer in kCFRunLoopCommonModes so the GUI
#   keeps updating during mouse-tracking loops instead of freezing.
# - egui-baseview 0.3.0: Queue::resize physical->logical unit fix so windows
#   aren't resized pixels_per_point times too large on scaled displays.
[patch.crates-io]
baseview = { path = "vendor/baseview" }
egui-baseview = { path = "vendor/egui-baseview" }
nice-plug = { path = "vendor/nice-plug" }

[profile.release]
# Cross-crate LTO reaches exactly one artifact here, and it is not the plugin.
# `harmonigraph-plugin` is `crate-type = ["cdylib", "lib"]`, and cargo does not
# LTO a unit that also emits an rlib, so the bundle Bitwig loads compiles
# identically either way. That leaves `harmonigraph-offline`, whose frame loop
# waits on the GPU: at 1920x1080 it renders in 20.4s against 20.5s, which is
# noise.
#
# The cost is charged to every build in every worktree. `thin` puts
# `-C linker-plugin-lto` on the whole dependency graph, so egui, naga and
# wgpu-core each compile about 30% dearer to emit bitcode only the offline
# binary reads, and it turns that binary's link into a 42s single-core tail at
# the end of a 213s build. A clean release build is 2m23s here and 3m32s with
# `thin`.
lto = false
# The symbol table stays, because a hang is the one failure that leaves nothing
# to read. A panic writes itself into Bitwig's engine.log and a segfault leaves
# a crash report, but a plug-in host that stops answering is SIGKILLed by the
# host after about thirty seconds — no report, no log line — so the only account
# of it is a `sample` taken while it is still stuck, and against a stripped
# binary that is a column of `???`.
#
# Names only. `debug` is off here, so there is no debuginfo to keep and this
# strips everything there is to strip; what it costs is the symbol table's own
# bytes, and no build time. Line numbers would mean carrying DWARF through a
# release build in every worktree, which is a real cost against a stack trace
# that already names the function.
strip = "debuginfo"

# Plugin GUIs are unusable in unoptimized debug builds; opt-level 2 keeps
# dev iteration usable while still compiling fast-ish.
#
# Debuginfo is the other half of what a dev build costs. Under the default
# `debug = true` a populated `target/debug` runs to 19 GB, and with a target
# dir per worktree that is the single biggest consumer of the disk. Line
# tables are all the panic backtraces in our own crates need; dependency
# debuginfo is bulk nobody steps through, so it goes entirely.
[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
