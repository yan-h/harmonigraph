[workspace]
resolver = "2"
members = [
    "crates/lattice-core",
    "crates/lattice-scene",
    "crates/lattice-render",
    "crates/lattice-ui",
    "crates/lattice-standalone",
    "crates/midi_lattice_3d",
    "xtask",
]
# The vendored crate is its own workspace, only referenced via [patch].
exclude = ["vendor/baseview"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Yan Han <yanhan13@gmail.com>"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal crates
lattice-core = { path = "crates/lattice-core" }
lattice-scene = { path = "crates/lattice-scene" }
lattice-render = { path = "crates/lattice-render" }
lattice-ui = { path = "crates/lattice-ui" }

# GUI stack. These versions are coupled:
#   egui-baseview 0.3 -> egui 0.35 / egui-wgpu 0.35 / wgpu 29 / baseview 0.1
#   eframe must match egui, egui_dock 0.20 -> egui 0.35
# When bumping egui, bump all of these together.
egui = "0.35"
egui-wgpu = "0.35"
eframe = { version = "0.35", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
] }
egui_dock = "0.20"
egui-baseview = { version = "0.3", default-features = false, features = [
    "wgpu",
    # Required when default features are off: the crate's log macros come
    # from either `tracing` or `nice-log`.
    "tracing",
] }
# Patched below ([patch.crates-io]) with the macOS run-loop fix; see PATCHES.md.
baseview = "0.1.4"

# Plugin framework: the community continuation of nih-plug. Host->plugin
# window resizing is supported natively (ResizeHint / Editor::set_size).
nice-plug = "0.1.10"
nice-plug-xtask = "0.1.1"

# Math / utility
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
rtrb = "0.3"
crossbeam = "0.8"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
raw-window-handle = "0.5"

# Vendored baseview 0.1.4 with one fix: the macOS frame timer runs in
# kCFRunLoopCommonModes instead of the default mode, so the GUI keeps
# updating during mouse-tracking loops (native window resize etc.) instead
# of freezing until mouse release. See PATCHES.md. TODO: upstream this.
[patch.crates-io]
baseview = { path = "vendor/baseview" }

[profile.release]
lto = "thin"
strip = "symbols"

# Plugin GUIs are unusable in unoptimized debug builds; opt-level 2 keeps
# dev iteration usable while still compiling fast-ish.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
