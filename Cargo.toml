[workspace]
resolver = "2"
members = [
    "crates/harmonigraph-core",
    "crates/harmonigraph-analysis",
    "crates/harmonigraph-scene",
    "crates/harmonigraph-render",
    "crates/harmonigraph-golden",
    "crates/harmonigraph-perf",
    "crates/harmonigraph-ui",
    "crates/harmonigraph-take",
    "crates/harmonigraph-record",
    "crates/harmonigraph-offline",
    "crates/harmonigraph-standalone",
    "crates/harmonigraph-plugin",
    "crates/harmonigraph-clap",
    "crates/harmonigraph-state-reader",
    "xtask",
]
# The vendored crate is its own workspace, only referenced via [patch].
exclude = ["vendor/wgpu-hal"]

[workspace.package]
version = "0.6.1"
edition = "2021"
authors = ["Yan Han"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Internal crates
harmonigraph-core = { path = "crates/harmonigraph-core" }
harmonigraph-analysis = { path = "crates/harmonigraph-analysis" }
harmonigraph-scene = { path = "crates/harmonigraph-scene" }
harmonigraph-render = { path = "crates/harmonigraph-render" }
# Dev-only: the byte-exact frame gate, shared by every crate that keeps a set.
harmonigraph-golden = { path = "crates/harmonigraph-golden" }
harmonigraph-perf = { path = "crates/harmonigraph-perf" }
harmonigraph-ui = { path = "crates/harmonigraph-ui" }
harmonigraph-take = { path = "crates/harmonigraph-take" }
harmonigraph-record = { path = "crates/harmonigraph-record" }
# The renderer, a library whose one binary the plugin package builds (#1954).
harmonigraph-offline = { path = "crates/harmonigraph-offline" }
# The CLAP shell: nice-plug and nice-plug-core, owned (PATCHES.md).
harmonigraph-clap = { path = "crates/harmonigraph-clap" }

# GUI stack. These versions are coupled:
#   egui-baseview 0.3 -> egui 0.37 / egui-wgpu 0.37 / wgpu 30 / baseview 0.1
#   eframe must match egui
# When bumping egui, bump all of these together.
# egui's bundled faces are the per-glyph fallbacks behind the product face
# (`harmonigraph-ui`'s `install_fonts`). Since 0.37 egui ships none by
# default, and its symbol faces only with its emoji ones, which are where a
# linked interval's `↔` badge comes from.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui-wgpu = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "wgpu",
    "default_fonts",
    "wayland",
    "x11",
    "persistence",
] }
egui-baseview = { version = "0.3", default-features = false, features = [
    "wgpu",
    # Required when default features are off: the crate's log macros come
    # from either `tracing` or `nice-log`.
    "tracing",
] }
# The editor's own window, from egui-plugin-window at the commit the
# `[patch.crates-io]` below pins egui-baseview to: the two move together.
# A plain git dependency, since it is no crates.io crate.
plugin-own-window = { git = "https://github.com/yan-h/egui-plugin-window", rev = "58a48eedbe40973a9370cde35383a9a1f9e0a243" }

# Math / utility
glam = { version = "0.34", features = ["serde"] }
# LCH color math, same crate v1 used so channel colors match exactly.
color_space = "0.5"
# Shader validation for hot-reload (dev only); version tracks wgpu's.
naga = "30"
bytemuck = { version = "1", features = ["derive"] }
# Blocks on wgpu's async setup; the version eframe and egui-baseview take.
pollster = "1"
# Hashing for maps keyed on lattice positions and note identities, which
# nothing outside the plugin chooses: SipHash's flooding resistance buys
# nothing there and costs it every frame. Already in the graph via wgpu.
foldhash = "0.2"
rtrb = "0.3"
# The tuning configuration audio reads at each callback (#1938): wait-free,
# with no lock for a reader's release to take.
triple_buffer = "8"
crossbeam = "0.8"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
# Persist format shared by appearance and editor workspace settings.
ron = "0.12"
# Names each key a saved look carries that this build no longer reads (#1927).
serde_ignored = "0.1"
# Hardware MIDI input for the standalone dev harness.
midir = "0.11"
raw-window-handle = "0.5"
# The audio-thread allocation guard, which has to survive `--release`: always
# without default features. `nice-assert-no-alloc` gates its whole
# implementation, `AllocDisabler` and the enforcing `assert_no_alloc` alike, on
# `not(all(feature = "disable_release", not(debug_assertions)))`, and ships
# `disable_release` in its defaults. Under `--release` that deletes the type
# `harmonigraph-record`'s audio tests name as their global allocator, so
# `cargo test --release --workspace` does not compile (#805), and every
# `assert_no_alloc` call elsewhere compiles against the no-op arm and guards
# nothing. Features unify across a build, so one declaration with defaults on
# brings it back for all: every declarer names this entry. Until
# harmonigraph-clap was owned, one declarer was a registry crate, and a
# `[profile.release.package]` override forced debug assertions on instead.
# Reachable only through dev-dependencies and harmonigraph-clap's optional
# `assert_process_allocs`: a plugin or offline release build never compiles it.
nice-assert-no-alloc = { version = "1.0", default-features = false }

# Crates with local patches, vendored or pinned. PATCHES.md lists what each
# one carries, or where that is listed, and how each is upgraded.
[patch.crates-io]
# The editor window (egui-baseview, which brings baseview from the same
# commit) is shared with otonal and pinned here by commit. The plugin names
# baseview only through `egui_baseview::baseview`, so it has no pin of its
# own to keep in step. A change lands in egui-plugin-window first and reaches
# Harmonigraph as a bump of this rev, and of plugin-own-window's above;
# PATCHES.md says how to try one locally.
egui-baseview = { git = "https://github.com/yan-h/egui-plugin-window", rev = "58a48eedbe40973a9370cde35383a9a1f9e0a243" }
wgpu-hal = { path = "vendor/wgpu-hal" }

[profile.release]
# Cross-crate LTO reaches exactly one artifact here, and it is not the plugin.
# `harmonigraph-plugin` is `crate-type = ["cdylib", "lib"]`, and cargo does not
# LTO a unit that also emits an rlib, so the bundle Bitwig loads compiles
# identically either way. That leaves `harmonigraph-offline`, whose frame loop
# waits on the GPU: at 1920x1080 it renders in 20.4s against 20.5s, which is
# noise.
#
# The cost is charged to every build in every worktree. `thin` puts
# `-C linker-plugin-lto` on the whole dependency graph, so egui, naga and
# wgpu-core each compile about 30% dearer to emit bitcode only the offline
# binary reads, and it turns that binary's link into a 42s single-core tail at
# the end of a 213s build. A clean release build is 2m23s here and 3m32s with
# `thin`.
lto = false
# The symbol table stays, because a hang is the one failure that leaves nothing
# to read. A panic writes itself into Bitwig's engine.log and a segfault leaves
# a crash report, but a plug-in host that stops answering is SIGKILLed by the
# host after about thirty seconds — no report, no log line — so the only account
# of it is a `sample` taken while it is still stuck, and against a stripped
# binary that is a column of `???`.
#
# Names only. `debug` is off here, so there is no debuginfo to keep and this
# strips everything there is to strip; what it costs is the symbol table's own
# bytes, and no build time. Line numbers would mean carrying DWARF through a
# release build in every worktree, which is a real cost against a stack trace
# that already names the function.
strip = "debuginfo"

# Plugin GUIs are unusable in unoptimized debug builds; opt-level 2 keeps
# dev iteration usable while still compiling fast-ish.
#
# Debuginfo is the other half of what a dev build costs. Under the default
# `debug = true` a populated `target/debug` runs to 19 GB, and with a target
# dir per worktree that is the single biggest consumer of the disk. Line
# tables are all the panic backtraces in our own crates need; dependency
# debuginfo is bulk nobody steps through, so it goes entirely.
[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
