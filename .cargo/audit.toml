# `cargo audit`'s settings, read from the project root by the binary itself —
# so a run here and the run in `.github/workflows/audit.yml` see one list, for
# the same reason `ci.sh` holds every other gate: a check that says something
# different locally than remotely is worse than no check.
#
# An entry below is a claim that an advisory cannot reach this tree, and it is
# only as good as the condition that retires it. An ignore that outlives its
# reason is a watcher that has quietly stopped watching, which is the too-wide
# cache key in different clothes: it never goes stale and never goes still.
# So each one carries what would remove it, and #597 carries the measurements.

[advisories]
# Empty. The last two entries, quick-xml 0.39.4's RUSTSEC-2026-0194/0195,
# stopped firing once the lockfile reached quick-xml 0.41.0 (#1535) and were
# removed with #1529.
ignore = []
