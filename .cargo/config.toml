[alias]
# `cargo xtask bundle harmonigraph-plugin --release` builds the CLAP bundle.
# xtask runs in release mode so serde etc. aren't compiled twice.
xtask = "run --package xtask --release --"
xtask-debug = "run --package xtask --"

# Every worktree gets its own `target/`, so without a shared cache each new
# session recompiles all ~465 dependencies from scratch: 4m31s for a cold
# release build plus 5m20s for a cold `cargo test` compile. The dependency set
# barely moves between branches, so sccache serves those objects from one
# ~/Library/Caches/Mozilla.sccache store and only our own crates recompile.
#
# Per-worktree `target/` dirs stay, which is the point: parallel sessions never
# serialise on a shared target lock, they just share the compiled deps.
#
# Cargo builds workspace crates incrementally and sccache cannot cache those —
# it forwards them to rustc uncached, which is fine, they are the ones that
# change. Leaving incremental on keeps the warm edit-rebuild loop fast.
#
# This needs `sccache` on PATH (`brew install sccache`). If it is ever missing
# every build fails with "could not execute process sccache" — comment this
# line out to fall back to plain rustc.
[build]
rustc-wrapper = "sccache"

# The macOS editor's frames come from a view's display link, which needs
# macOS 14 (#1551). Raising the floor here stamps it into the dylib's
# LC_BUILD_VERSION; whether a host on an older system refuses the bundle or
# loads it and fails at the first display link is untested, and neither is
# supported. nice-plug-xtask's Info.plist carries no LSMinimumSystemVersion.
[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

# Every binary cargo runs — `cargo test`, `cargo run`, through `ci.sh` or not —
# goes through tools/test-runner, which appends a line to a log outside the
# worktree when a LOCAL test binary fails (docs/development.md). Agents run the
# tests before every push, so nearly every failure a test catches happens here
# and never reaches CI; the guard audit of 2026-11-10 had to dig them out of
# transcripts, and the next one (#1711) reads this log instead.
#
# A runner in this file rather than a hook in ci.sh, because 18 of the audit's
# 28 local regression-test failures came from a plain `cargo test` and 1 from
# ci.sh. It passes everything else, and every run in GitHub Actions, straight
# to exec. `cfg(all())` matches every target, so a cloud session's Linux build
# takes it too; the relative path resolves against this file's parent, so it
# names the script in whichever worktree is building. Doctests reach it too,
# through rustdoc's `--test-runtool`, and pass straight through unlogged.
#
# Known cost on every path, passthrough included: the `/usr/bin/env` shebang
# is SIP-protected on macOS, so DYLD_* variables (cargo's
# DYLD_FALLBACK_LIBRARY_PATH among them) never reach the binary, and Python
# exports LC_CTYPE=C.UTF-8 where no locale is set. Nothing here links a
# dylib through that path today; a dependency that does would fail to load
# only under cargo. Fixing it needs a compiled runner, which this temporary
# measure does not earn.
#
# Temporary: remove this table and tools/test-runner once #1711 is decided.
[target.'cfg(all())']
runner = "tools/test-runner"
