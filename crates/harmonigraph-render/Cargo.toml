[package]
name = "harmonigraph-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# No doc-tests: each crate's empty rustdoc harness was a run for nothing
# (#1181). Drop this with the first doc example that should run.
doctest = false

[features]
# Dev-only: watch the .wgsl on disk and rebuild the pipeline on change.
# Enabled by the standalone harness; release plugin bundles are built
# per-package and never activate it.
hot-reload = ["dep:naga"]
# Export/strict validation of generated assets; no toolchain work during builds.
shader-assets-tools = []
# For other crates' tests: one device's own GPU memory peak
# (`gpu_memory::snapshot_of`), since a test shares its process, and so the
# record, with other tests' devices.
test-support = []

[dependencies]
harmonigraph-scene = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
naga = { workspace = true, optional = true }
# Blocks on wgpu's async adapter/device setup in `SpectrogramHeadless`,
# which is a library entry point rather than a test helper.
# Held at 0.4, which eframe and vendored egui-baseview pin; moves to 1.0
# with the GUI stack (docs/gui-cohort-feasibility.md).
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
harmonigraph-metal-assets = { workspace = true }

# The GPU memory record (`gpu_memory`) reads liveness and sizes off the Metal
# objects under wgpu: the same crates, at the same versions, as `wgpu-hal`.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLBuffer", "MTLDevice", "MTLResource", "MTLTexture"] }

[dev-dependencies]
# The baked-shader validation test runs without the hot-reload feature.
naga = { workspace = true, features = ["wgsl-in"] }
# The offscreen-vs-direct parity test builds a Scene literal, whose
# NodeInstance carries a LatticePos.
harmonigraph-core = { path = "../harmonigraph-core" }
# The byte-exact frame gate the golden set is measured by.
harmonigraph-golden = { workspace = true }
# Reads the view out of the golden set's pinned look, which is RON.
ron = { workspace = true }
serde = { workspace = true }
