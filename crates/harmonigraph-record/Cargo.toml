[package]
name = "harmonigraph-record"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[features]
# Lets dependent crates drive the real audio-thread Recorder into in-memory
# rings without starting the file-writer thread. Never enabled in a bundle.
test-support = []

# Half of this crate runs on the audio thread, so nothing on the record path
# may allocate or block: rtrb for the rings, parking_lot for the one mutex the
# GUI and writer threads share. Nothing here reaches egui or wgpu, and the
# dependency list is what makes that checkable rather than merely intended —
# `ParamKey` (what a recorded automation record is named by) and `RenderConfig`
# (what the Video pane asks for) are take payload and live in
# harmonigraph-take, and `RenderProgress` (what this crate reports back) sits
# beside them, so no GUI stack is linked.
[dependencies]
harmonigraph-core = { workspace = true }
harmonigraph-take = { workspace = true }

rtrb = { workspace = true }
parking_lot = { workspace = true }
