[package]
name = "harmonigraph-scene"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# No doc-tests: each crate's empty rustdoc harness was a run for nothing
# (#1181). Drop this with the first doc example that should run.
doctest = false

[features]
# The designed colour curve the shared colour table samples, for the UI's test
# that measures the table against it on the fresh look's gradients, whose
# level gradient is the UI's. Only the UI's dev-dependencies enable it.
testing = []

[dependencies]
harmonigraph-core = { workspace = true }
glam = { workspace = true }
color_space = { workspace = true }
serde = { workspace = true }
foldhash = { workspace = true }

[dev-dependencies]
ron = { workspace = true }
