# nice-plug-derive 0.1.2's normalized manifest, renamed and kept as a member of
# the workspace until the parameter layer replaces the derives. The library keeps
# the name `nice_plug_derive`, by which `harmonigraph-clap` imports it.

[package]
edition = "2024"
name = "harmonigraph-clap-derive"
version = "0.1.2"
authors = [
    "Robbert van der Helm <mail@robbertvanderhelm.nl>",
    "Billy Messenger <billydm@noreply.codeberg.org>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Proc macros for the nice-plug framework"
publish = false
readme = false
keywords = [
    "audio",
    "plugin",
    "vst",
    "vst3",
]
license = "ISC"
repository = "https://codeberg.org/RustAudio/nice-plug"

[lib]
name = "nice_plug_derive"
path = "src/lib.rs"
proc-macro = true

[dependencies.proc-macro2]
version = "1.0"

[dependencies.quote]
version = "1.0"

[dependencies.syn]
version = "1.0"
features = ["extra-traits"]
