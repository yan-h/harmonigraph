# Cargo's normalized form of the published manifest, edited in place since
# the fork was pruned to what harmonigraph compiles on macOS (PATCHES.md).

[package]
edition = "2024"
rust-version = "1.87"
name = "nice-plug"
version = "0.1.10"
authors = [
    "Robbert van der Helm <mail@robbertvanderhelm.nl>",
    "Billy Messenger <billydm@noreply.codeberg.org>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "An audio plugin development framework that is nice to use :)"
readme = "README.md"
keywords = [
    "audio",
    "plugin",
    "clap",
    "vst",
    "vst3",
]
categories = ["multimedia::audio"]
license = "ISC"
repository = "https://codeberg.org/RustAudio/nice-plug"

[package.metadata.docs.rs]
all-features = true

[features]
# Enables deterministic scheduling observations only in the boundary fixtures.
clap-boundary-tests = []
assert_process_allocs = [
    "dep:nice-assert-no-alloc",
    "nice-plug-core/assert_process_allocs",
]

[lib]
name = "nice_plug"
path = "src/lib.rs"

[[test]]
name = "derive_params"
path = "tests/derive_params.rs"

[[test]]
name = "derive_persist"
path = "tests/derive_persist.rs"

[[test]]
name = "clap_boundary"
path = "tests/clap_boundary.rs"
required-features = ["assert_process_allocs", "clap-boundary-tests"]

[[test]]
name = "clap_auxiliary"
path = "tests/clap_auxiliary.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.anymap3]
version = "1.0.1"

[dependencies.atomic_float]
version = "1.1"

[dependencies.atomic_refcell]
version = "0.1"

[dependencies.backtrace]
version = "0.3.76"

[dependencies.clap-sys]
version = "0.5.0"

[dependencies.crossbeam]
version = "0.8"

[dependencies.log]
version = "0.4"

[dependencies.nice-assert-no-alloc]
version = "1.0"
features = [
    "backtrace",
    "log",
]
optional = true

[dependencies.nice-log]
version = "0.2.4"

[dependencies.nice-plug-core]
version = "0.1.5"

[dependencies.nice-plug-derive]
version = "0.1.2"

[dependencies.parking_lot]
version = "0.12"

[dependencies.rtrb]
version = "0.3.3"

[dependencies.serde_json]
version = "1.0"

[dev-dependencies.approx]
version = "0.5.1"

[workspace]
