[package]
name = "harmonigraph-standalone"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
harmonigraph-core = { workspace = true }
harmonigraph-ui = { workspace = true }
harmonigraph-render = { workspace = true, features = ["hot-reload"] }
harmonigraph-take = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
midir = { workspace = true }
# PNG encode for the LATTICE_SCREENSHOT self-capture hook (already in the
# tree transitively; png-only keeps the build slim).
image = { version = "0.25", default-features = false, features = ["png"] }
