[package]
name = "harmonigraph-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
# No doc-tests: each crate's empty rustdoc harness was a run for nothing
# (#1181). Drop this with the first doc example that should run.
doctest = false

[dependencies]
harmonigraph-core = { workspace = true }
harmonigraph-analysis = { workspace = true }
harmonigraph-scene = { workspace = true }
harmonigraph-render = { workspace = true }
harmonigraph-perf = { workspace = true }
harmonigraph-take = { workspace = true }
egui = { workspace = true, features = ["serde"] }
glam = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }

[dev-dependencies]
egui-wgpu = { workspace = true }
pollster = "0.4"
