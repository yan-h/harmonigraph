[package]
name = "harmonigraph-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
harmonigraph-core = { workspace = true }
harmonigraph-scene = { workspace = true }
harmonigraph-render = { workspace = true }
egui = { workspace = true }
egui_dock = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }

# Reading this process's resident memory for the performance overlay. macOS
# only (proc_pidinfo); Linux reads /proc/self/statm with no dep, other targets
# report "n/a". Already in the tree transitively, so this adds no build cost.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
