[package]
name = "harmonigraph-offline"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
harmonigraph-core = { workspace = true }
harmonigraph-ui = { workspace = true }
harmonigraph-render = { workspace = true }
harmonigraph-take = { workspace = true }
# View settings this crate only ever NAMES — the picture is `harmonigraph-ui`'s
# to draw. The probes set them, so a `SharedState` field whose type lives in
# `harmonigraph-scene` has to be nameable here.
harmonigraph-scene = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
serde = { workspace = true }
ron = { workspace = true }
# Blocks on wgpu's async adapter/device setup; there is no event loop
# here to be async around.
pollster = "0.4"
# PNG output for single-frame checks. The moving picture goes out as raw
# frames to ffmpeg, which needs no crate at all.
image = { version = "0.25", default-features = false, features = ["png"] }
