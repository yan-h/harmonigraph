[package]
name = "midi_lattice_3d"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "3D Tonnetz MIDI visualizer plugin"
homepage = "https://github.com/yan-h/midi-lattice-3d"

[lib]
# cdylib for the plugin bundle, lib so tests/other tools can link it.
crate-type = ["cdylib", "lib"]

[dependencies]
lattice-core = { workspace = true }
lattice-ui = { workspace = true }
lattice-take = { workspace = true }
lattice-render = { workspace = true }

nice-plug = { workspace = true }
egui = { workspace = true }
egui-baseview = { workspace = true }
baseview = { workspace = true }
raw-window-handle = { workspace = true }

rtrb = { workspace = true }
crossbeam = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
