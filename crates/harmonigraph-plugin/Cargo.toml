[package]
name = "harmonigraph-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tonnetz harmony and spectrum visualizer plugin"
homepage = "https://github.com/yan-h/harmonigraph"

[lib]
# cdylib for the plugin bundle, lib so tests/other tools can link it.
crate-type = ["cdylib", "lib"]
# No doc-tests: each crate's empty rustdoc harness was a run for nothing
# (#1181). Drop this with the first doc example that should run.
doctest = false

[features]
# Log every editor frame's timing to ~/Library/Logs/Harmonigraph (macOS), for
# diagnosing missed refreshes. A diagnostic build only; see
# vendor/egui-baseview/src/frame_log.rs.
frame-log = ["egui-baseview/frame-log"]
startup-probe =["dep:egui-wgpu", "objc2-app-kit/NSApplication", "objc2-app-kit/NSEvent", "objc2-app-kit/NSGraphicsContext"]

[[example]]
name = "editor-startup"
required-features = ["startup-probe"]

[dependencies]
harmonigraph-core = { workspace = true }
harmonigraph-take = { workspace = true }
harmonigraph-ui = { workspace = true }
# The shell fills in `ShellTimings` for the performance overlay, which is the
# one instrumentation contract this crate holds up its end of.
harmonigraph-perf = { workspace = true }
harmonigraph-record = { workspace = true }
harmonigraph-render = { workspace = true }

nice-plug = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true, optional = true }
egui-baseview = { workspace = true }
baseview = { workspace = true }
raw-window-handle = { workspace = true }

rtrb = { workspace = true }
crossbeam = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { version = "1" }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSResponder", "NSControl", "NSButton", "NSButtonCell", "NSPopUpButton", "NSTextField", "NSCell", "NSMenu", "NSMenuItem", "NSSlider", "NSWindow", "NSGraphics", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSTimer", "NSNotification", "NSURL", "NSArray", "NSDictionary", "NSValue", "NSEnumerator"] }

[dev-dependencies]
nice-plug = { workspace = true, features = ["clap-boundary-tests", "assert_process_allocs"] }
nice-assert-no-alloc = "1.0"
clap-sys = "0.5.0"
# The process fixture arms the real Recorder but captures into memory, so a
# test can reach take audio without writing into ~/Music.
harmonigraph-record = { workspace = true, features = ["test-support"] }
