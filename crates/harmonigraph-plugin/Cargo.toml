[package]
name = "harmonigraph-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tonnetz harmony and spectrum visualizer plugin"
homepage = "https://github.com/yan-h/harmonigraph"

[lib]
# cdylib for the plugin bundle, lib so tests/other tools can link it.
crate-type = ["cdylib", "lib"]
# No doc-tests: each crate's empty rustdoc harness was a run for nothing
# (#1181). Drop this with the first doc example that should run.
doctest = false

[features]
# Log every editor frame's timing to ~/Library/Logs/Harmonigraph (macOS), for
# diagnosing missed refreshes. A diagnostic build only; see
# egui-baseview/src/frame_log.rs in egui-plugin-window.
frame-log = ["egui-baseview/frame-log"]
startup-probe =["objc2-app-kit/NSApplication", "objc2-app-kit/NSEvent", "objc2-app-kit/NSGraphicsContext"]

[[example]]
name = "editor-startup"
required-features = ["startup-probe"]

[dependencies]
harmonigraph-core = { workspace = true }
harmonigraph-take = { workspace = true }
harmonigraph-ui = { workspace = true }
# The shell fills in `ShellTimings` for the performance overlay, which is the
# one instrumentation contract this crate holds up its end of.
harmonigraph-perf = { workspace = true }
harmonigraph-record = { workspace = true }
harmonigraph-render = { workspace = true }

# Its library is `nice_plug`, the name the code below uses.
harmonigraph-clap = { workspace = true }
egui = { workspace = true }
# The editor's device is made at activation, before any window, from the
# window's own setup (`editor::start_graphics`).
egui-wgpu = { workspace = true }
pollster = "0.4"
egui-baseview = { workspace = true }
raw-window-handle = { workspace = true }
# The editor's own window, shared with otonal (`editor::pop_out`).
plugin-own-window = { workspace = true }

rtrb = { workspace = true }
crossbeam = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { version = "1" }
# The tape's audition speed (#1719 slice 5): pitch-preserving time-stretch,
# a header-only C++ library built by `cc`, its bindings by `bindgen`
# (libclang at build time). Runs on the input worker, never in `process`.
signalsmith-stretch = "0.1.3"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSView", "NSResponder", "NSControl", "NSButton", "NSButtonCell", "NSTextField", "NSCell"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSTimer", "NSDate", "NSGeometry", "objc2-core-foundation"] }

[dev-dependencies]
harmonigraph-clap = { workspace = true, features = ["clap-boundary-tests", "assert_process_allocs"] }
nice-assert-no-alloc = { workspace = true }
clap-sys = "0.5.0"
# The process fixture arms the real Recorder but captures into memory, so a
# test can reach take audio without writing into ~/Music.
harmonigraph-record = { workspace = true, features = ["test-support"] }
# A look edit and its undo depth without a window, for the #1740 test.
harmonigraph-ui = { workspace = true, features = ["testing"] }
# Which device the startup job compiles on, for the activation test.
harmonigraph-render = { workspace = true, features = ["test-support"] }
