[package]
name = "harmonigraph-take"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Deliberately tiny: this crate is linked into the PLUGIN, whose audio
# thread writes takes. Nothing here may pull in a GUI stack, and nothing
# on the write path may allocate or block. serde + ron only.
#
# That is what keeps `harmonigraph-record` — the recorder and the render
# driver, which need ParamKey and RenderConfig out of harmonigraph-ui — a
# crate beside this one rather than a module inside it.
[dependencies]
serde = { workspace = true }
ron = { workspace = true }
