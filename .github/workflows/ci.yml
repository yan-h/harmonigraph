name: Full CI

on:
  pull_request:
  # Once a PR lands: the first run of it beside whatever else landed since it
  # was tested, now that a PR need not be up to date to merge. rust-cache also
  # saves its archive only from main.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A PR's newer push supersedes its older run. A push to main supersedes
# nothing: each is the first run of what it landed beside, so every one gets its
# own group, and a merge close behind another neither cancels it nor leaves a
# red `Full CI` on a commit that failed nothing. The price is a burst of merges
# running side by side on the macOS cap rather than only the newest surviving.
concurrency:
  group: full-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  # sccache checks it can read and write the cache when its server starts,
  # and a failed check is fatal: on 2026-10-20 the Actions cache's storage
  # answered that read with 503 ServerBusy, "Egress is over the account
  # limit", and every rustc call failed before compiling anything (run
  # 39436707766). Past startup a failed read is already a cache miss and a
  # failed write is dropped, so skipping the check turns a throttled cache
  # into a slower build rather than a red one. Needs sccache 0.18.
  SCCACHE_SKIP_CACHE_CHECK: "true"

jobs:
  full-ci:
    # The check reads as "workspace" and "isolated"; the `Full CI` name stays on
    # the summary job below, which is the one to look at on a PR.
    name: ${{ matrix.group }}
    # Pinned rather than macos-latest, so that a new image (its Xcode, Metal
    # toolchain and SDK) lands in a PR of its own instead of turning every
    # branch red the day GitHub moves the alias. The golden frames no longer
    # care: they are compared against the base drawn in the same job.
    runs-on: macos-26
    env:
      # Pixel tests must render; a missing adapter must not become a green skip.
      HARMONIGRAPH_REQUIRE_GPU: "1"
      # The soundtrack and export-length tests need a real ffmpeg and ffprobe
      # (#1119). Set in both groups, so a test that moves to one without the
      # install below fails rather than skipping.
      HARMONIGRAPH_REQUIRE_FFMPEG: "1"
      # The base tools/golden-diff.py draws against: on a pull_request the
      # checkout is the PR merged into main, so its first parent is that main.
      # Hence fetch-depth 2 below. A push to main has no PR body to state a
      # move in, so it does not draw the goldens twice for nobody to read.
      GOLDEN_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'none' }}
    # A green run takes about 10 minutes; the margin is for a cold cache.
    timeout-minutes: 30
    strategy:
      # Both groups always report. A failure in one says nothing about the
      # other, and cancelling the survivor would hide half the answer behind a
      # second push.
      fail-fast: false
      matrix:
        # ci.sh owns this list; .claude/tests/ci-groups.sh fails when the two
        # copies stop agreeing, because a group missing here runs NOWHERE and
        # the PR still goes green. Read the rationale for the count — and for
        # why it is not larger — next to CI_GROUPS in ci.sh.
        group: [workspace, isolated]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          # Both groups want the same ~/.cargo, so one key serves them instead
          # of the per-job default, which would mint an archive per group.
          shared-key: full-ci
          # Saving only from main stops the matrix from doubling THIS archive's
          # write rate into a cache already at GitHub's 10 GB per-repo cap
          # (10.8 GB over 4601 entries as this landed), where every entry past
          # the cap evicts another by LRU. A branch still RESTORES main's
          # archive through the restore key and re-fetches only what its own
          # lockfile moved.
          #
          # It does NOT fix the cap, and nothing here should be read as if it
          # did: `save-if` reaches only rust-cache's ~/.cargo archive, while
          # SCCACHE_GHA_ENABLED above writes compilation artifacts into the
          # same 10 GB budget on every run including branches, ungated, and
          # that is the larger share by volume — 4601 entries, nearly all of
          # them sccache's. The matrix adds a second concurrent writer there
          # that this key cannot gate. Pruning that is its own job.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The runner image has no ffmpeg, and only `workspace` runs the
      # harmonigraph-offline tests that need it; the golden ones `isolated`
      # draws do not.
      - name: Install ffmpeg
        if: matrix.group == 'workspace'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg

      # Keep every full gate in ci.sh so local on-demand and remote runs cannot
      # silently diverge: this passes a group, never a gate list.
      - name: Run full CI
        run: ./ci.sh ${{ matrix.group }}

      # What tools/golden-diff.py drew and found: both sides' frames, a contact
      # sheet per moved frame, report.md and `changed`, which the summary job
      # below reads. Only `isolated` runs it.
      - name: Upload the golden diff
        if: always() && matrix.group == 'isolated'
        uses: actions/upload-artifact@v4
        with:
          name: golden-diff
          path: target/golden-diff/
          if-no-files-found: ignore
          # A re-run attempt of the same job uploads under the same name.
          overwrite: true
          retention-days: 14

  # One check to read, and the name a human already looks for, so that splitting
  # the work in two did not turn "did CI pass?" into a question about a matrix.
  # It runs on Linux deliberately — the macOS concurrency cap is the budget the
  # split is spending, and a summary step needs none of it.
  full-ci-summary:
    name: Full CI
    runs-on: ubuntu-latest
    needs: full-ci
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Did every group pass?
        run: |
          echo "gate groups: ${{ needs.full-ci.result }}"
          [ "${{ needs.full-ci.result }}" = "success" ]

      - name: Download the golden diff
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: golden-diff
          path: golden-diff

      # A moved golden frame is a picture change, and the PR body is where it is
      # stated. Checked here, on Linux and after the groups, so that a PR body
      # missing the line is fixed by editing it and re-running this job alone
      # (`gh run rerun <run> --job <this job's id>`), seconds rather than another
      # macOS round. The body is fetched live because a re-run replays the
      # original event, whose copy of the body is the one that lacked the line.
      - name: Is every moved golden frame stated?
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cat golden-diff/report.md
          [ -s golden-diff/changed ] || exit 0
          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body)
          # Every row verbatim, mean and max included, so a statement written
          # for one push covers neither a frame a later push moves nor the same
          # frame moving again by a different amount.
          unstated=0
          while IFS= read -r row; do
            grep -qF -- "$row" <<<"$body" || { echo "not in the PR body: $row"; unstated=1; }
          done < golden-diff/changed
          if [ "$unstated" = 0 ]; then
            echo "every changed frame is stated in the PR body"
            exit 0
          fi
          echo "::error::Golden frames changed against main and the PR body does not carry their rows (listed above). Read the moved frames' contact sheets in this run's golden-diff artifact, paste the table above into the PR body with what moved and why, and re-run this job alone: gh run rerun $GITHUB_RUN_ID --job <this job's id>."
          exit 1
