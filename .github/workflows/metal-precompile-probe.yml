name: Metal shader assets

on:
  pull_request:
    paths:
      - .github/workflows/metal-precompile-probe.yml
      - tools/shader-assets.py
      - crates/harmonigraph-metal-assets/**
      - vendor/wgpu-hal/**
      - vendor/egui-baseview/**
      - Cargo.toml
      - Cargo.lock
      - crates/harmonigraph-render/**
      - crates/harmonigraph-plugin/src/editor.rs
      - crates/harmonigraph-plugin/src/editor/**
      - crates/harmonigraph-offline/**
      - crates/harmonigraph-standalone/src/main.rs
  workflow_dispatch:
    inputs:
      regenerate:
        description: Generate and validate a replacement corpus for import
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: metal-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      # Restore Full CI's ~/.cargo archive instead of minting one of this job's
      # own. Without `shared-key` the key carries the JOB NAME, so this step
      # wrote a separate `v0-rust-compile-*` archive from Full CI's
      # `v0-rust-full-ci-*`, and without `save-if` it wrote one PER BRANCH:
      # fifteen 106 MB copies of the same crates were live at once, 1.6 GB
      # against GitHub's 10 GB per-repo cap, for a job whose dependency set is
      # the workspace's. Everything past that cap evicts by LRU, and what was
      # being evicted was sccache's ~6000 entries — so a cache nobody read was
      # charged to every OTHER run's compile time.
      #
      # `save-if: false` rather than the main-only form Full CI uses, because
      # this workflow has no `push:` trigger at all: main never runs it, so a
      # main-gated save is one that can never fire. Restoring still works, and
      # is the whole point — a PR ref reads the default branch's caches, which
      # is exactly where the `full-ci` key is written.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: full-ci
          save-if: false
      - name: Check the committed production corpus
        if: ${{ !inputs.regenerate }}
        run: python3 tools/shader-assets.py check
      - name: Ensure Apple's compiler is available
        run: |
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Generate and validate replacement embedded assets
        if: ${{ inputs.regenerate }}
        run: python3 tools/shader-assets.py generate target/generated-metal-assets
      - name: Exercise metadata and provider fallback
        if: ${{ !inputs.regenerate }}
        run: python3 tools/shader-assets.py controls
      - name: Preserve assets and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-metal-assets
          path: |
            target/generated-metal-assets/
            target/shader-asset-logs/*.log
          if-no-files-found: warn
          retention-days: 7
