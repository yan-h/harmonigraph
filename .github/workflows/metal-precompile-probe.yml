name: Metal shader assets

on:
  pull_request:
    paths:
      - .github/workflows/metal-precompile-probe.yml
      - tools/shader-assets.py
      - crates/harmonigraph-metal-assets/**
      - vendor/wgpu-hal/**
      - vendor/egui-baseview/**
      - Cargo.toml
      - Cargo.lock
      - crates/harmonigraph-render/**
      - crates/harmonigraph-plugin/src/editor.rs
      - crates/harmonigraph-plugin/src/editor/**
      - crates/harmonigraph-offline/**
      - crates/harmonigraph-standalone/src/main.rs
  # Off a PR, or for a change the paths above miss: a stale corpus generates
  # its replacement here exactly as on a PR. `regenerate` forces one over a
  # corpus that passes, which is how a deleted shader's libraries leave it:
  # the check asks only that every library needed is present.
  workflow_dispatch:
    inputs:
      regenerate:
        description: Generate and validate a replacement corpus even if the committed one passes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: metal-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # A failed startup check of the cache is fatal; see ci.yml.
      SCCACHE_SKIP_CACHE_CHECK: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The PR's merge commit and the base it stands on (HEAD^1), so the
          # controls below can ask what the PR changed.
          fetch-depth: 2
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      # Restore Full CI's ~/.cargo archive instead of minting one of this job's
      # own. Without `shared-key` the key carries the JOB NAME, so this step
      # wrote a separate `v0-rust-compile-*` archive from Full CI's
      # `v0-rust-full-ci-*`, and without `save-if` it wrote one PER BRANCH:
      # fifteen 106 MB copies of the same crates were live at once, 1.6 GB
      # against GitHub's 10 GB per-repo cap, for a job whose dependency set is
      # the workspace's. Everything past that cap evicts by LRU, and what was
      # being evicted was sccache's ~6000 entries — so a cache nobody read was
      # charged to every OTHER run's compile time.
      #
      # `save-if: false` rather than the main-only form Full CI uses, because
      # this workflow has no `push:` trigger at all: main never runs it, so a
      # main-gated save is one that can never fire. Restoring still works, and
      # is the whole point — a PR ref reads the default branch's caches, which
      # is exactly where the `full-ci` key is written.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: full-ci
          save-if: false
      # A failed check carries on to generate the replacement in this same run,
      # because a stale corpus is what fails it and the replacement is the fix.
      # Stopping here made a branch dispatch `regenerate` and wait out a second
      # run of this job before it had anything to import. The last step decides
      # whether that failure fails the job.
      - name: Check the committed production corpus
        id: check
        if: ${{ !inputs.regenerate }}
        continue-on-error: true
        run: python3 tools/shader-assets.py check
      - name: Ensure Apple's compiler is available
        run: |
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Generate and validate replacement embedded assets
        if: ${{ inputs.regenerate || steps.check.outcome == 'failure' }}
        # Its own logs, so the check's logs that say why it failed survive.
        run: >-
          python3 tools/shader-assets.py generate target/generated-metal-assets
          --logs target/shader-asset-logs/generate
      # The controls are what make a stale corpus safe to ship: a library that
      # is missing, mismatched or invalid fails strictly and compiles from
      # source otherwise. A generating run already runs them on its replacement
      # (`generate` ends with them), so this is for a run whose check passed, and
      # only where the PR touched what they exercise: the backend patch that
      # loads libraries, the renderer's asset lookup and fallback, the probe
      # they drive, the corpus crate and this tooling. Run on every green check,
      # they cost ~2.3 macOS-minutes a run and never once failed. A dispatch has
      # no base to diff against and is a deliberate run, so it always runs them.
      - name: Decide whether the controls are owed
        id: scope
        if: ${{ steps.check.outcome == 'success' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "controls=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exercised='^(vendor/wgpu-hal/|crates/harmonigraph-metal-assets/|crates/harmonigraph-render/src/shader_assets|crates/harmonigraph-render/src/lattice_tests/metal_assets\.rs$|tools/shader-assets\.py$|\.github/workflows/metal-precompile-probe\.yml$)'
          # Its own statement, so a diff that cannot run fails the step rather
          # than reading as "nothing changed".
          changed=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$changed" | grep -E "$exercised"; then
            echo "controls=true" >> "$GITHUB_OUTPUT"
          else
            echo "controls=false" >> "$GITHUB_OUTPUT"
            echo "No change to what the controls exercise; skipping them."
          fi
      - name: Exercise metadata and provider fallback
        if: ${{ steps.scope.outputs.controls == 'true' }}
        run: python3 tools/shader-assets.py controls
      - name: Preserve assets and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-metal-assets
          path: |
            target/generated-metal-assets/
            target/shader-asset-logs/**/*.log
            target/shader-asset-logs/**/frames/diff/
          if-no-files-found: warn
          retention-days: 7
      # A stale corpus is REPORTED here, not failed: Full CI's `metal_corpus`
      # gate (ci.sh) runs this same strict catalog and is the one failing
      # verdict on it. With both failing, every stale corpus went red twice --
      # both checks red on all 94 pushes where both finished, 302 of 594 CI
      # failures from July to November, and not one defect either caught that
      # the other missed. A stale corpus only slows a cold open: the shipped
      # `Embedded` mode needs full input equality to use a library, so a stale
      # one misses and compiles from source, which the controls prove.
      #
      # Stale means the strict catalog named a missing asset AND the replacement
      # generated and validated above; a failed generation has failed the job
      # already. Any other check failure -- a corpus that fails its own hashes,
      # a library that will not load, goldens drawn through the corpus that
      # differ from source -- is not staleness and still fails the job. The test
      # is the strict panic's own words in a log of a check that already
      # failed, so a reworded panic lands in the failing arm: the safe way to
      # be wrong.
      - name: Report the corpus the check rejected
        if: ${{ steps.check.outcome == 'failure' }}
        run: |
          if grep -q "missing Metal asset" target/shader-asset-logs/strict-catalog.log 2>/dev/null; then
            message="The committed Metal corpus is stale, and this run generated and validated its replacement. With this commit checked out, run tools/shader-assets.py fetch, into the same commit as the change. Full CI's metal_corpus gate stays red until then."
            echo "::warning title=Stale Metal corpus::$message"
            echo "### Stale Metal corpus" >> "$GITHUB_STEP_SUMMARY"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The committed Metal corpus failed its check for a reason other than a missing asset. Read why in the artifact's shader-asset-logs/ (generate/ holds the replacement's own). A stale corpus names a missing Metal asset in strict-catalog.log; this one does not, so the replacement is not the fix."
            exit 1
          fi
