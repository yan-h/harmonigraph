name: Metal shader assets

on:
  pull_request:
    paths:
      - .github/workflows/metal-precompile-probe.yml
      - tools/shader-assets.py
      - crates/harmonigraph-metal-assets/**
      - vendor/wgpu-hal/**
      - vendor/egui-baseview/**
      - Cargo.toml
      - Cargo.lock
      - crates/harmonigraph-render/**
      - crates/harmonigraph-plugin/src/editor.rs
      - crates/harmonigraph-plugin/src/editor/**
      - crates/harmonigraph-offline/**
      - crates/harmonigraph-standalone/src/main.rs
  # Off a PR, or for a change the paths above miss: a stale corpus generates
  # its replacement here exactly as on a PR. `regenerate` forces one over a
  # corpus that passes, which is how a deleted shader's libraries leave it:
  # the check asks only that every library needed is present.
  workflow_dispatch:
    inputs:
      regenerate:
        description: Generate and validate a replacement corpus even if the committed one passes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: metal-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      # A failed startup check of the cache is fatal; see ci.yml.
      SCCACHE_SKIP_CACHE_CHECK: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      # Restore Full CI's ~/.cargo archive instead of minting one of this job's
      # own. Without `shared-key` the key carries the JOB NAME, so this step
      # wrote a separate `v0-rust-compile-*` archive from Full CI's
      # `v0-rust-full-ci-*`, and without `save-if` it wrote one PER BRANCH:
      # fifteen 106 MB copies of the same crates were live at once, 1.6 GB
      # against GitHub's 10 GB per-repo cap, for a job whose dependency set is
      # the workspace's. Everything past that cap evicts by LRU, and what was
      # being evicted was sccache's ~6000 entries — so a cache nobody read was
      # charged to every OTHER run's compile time.
      #
      # `save-if: false` rather than the main-only form Full CI uses, because
      # this workflow has no `push:` trigger at all: main never runs it, so a
      # main-gated save is one that can never fire. Restoring still works, and
      # is the whole point — a PR ref reads the default branch's caches, which
      # is exactly where the `full-ci` key is written.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: full-ci
          save-if: false
      # A failed check carries on to generate the replacement in this same run,
      # because a stale corpus is what fails it and the replacement is the fix;
      # the last step still fails the job. Stopping here made a branch dispatch
      # `regenerate` and wait out a second run of this job before it had
      # anything to import.
      - name: Check the committed production corpus
        id: check
        if: ${{ !inputs.regenerate }}
        continue-on-error: true
        run: python3 tools/shader-assets.py check
      - name: Ensure Apple's compiler is available
        run: |
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Generate and validate replacement embedded assets
        if: ${{ inputs.regenerate || steps.check.outcome == 'failure' }}
        # Its own logs, so the check's logs that say why it failed survive.
        run: >-
          python3 tools/shader-assets.py generate target/generated-metal-assets
          --logs target/shader-asset-logs/generate
      - name: Exercise metadata and provider fallback
        if: ${{ steps.check.outcome == 'success' }}
        run: python3 tools/shader-assets.py controls
      - name: Preserve assets and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-metal-assets
          path: |
            target/generated-metal-assets/
            target/shader-asset-logs/**/*.log
            target/shader-asset-logs/**/frames/diff/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail on the corpus the check rejected
        if: ${{ steps.check.outcome == 'failure' }}
        run: |
          echo "::error::The committed Metal corpus failed its check, and this run generated and validated a replacement. Read why in the artifact's shader-asset-logs/ (generate/ holds the replacement's own). A missing or rejected Metal asset is a stale corpus: with this commit checked out, run tools/shader-assets.py fetch, into the same commit as the change. Anything else is not the corpus, and the replacement is not the fix."
          exit 1
