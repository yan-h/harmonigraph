name: Metal precompile probe

on:
  pull_request:
    paths:
      - .github/workflows/metal-precompile-probe.yml
      - tools/metal-precompile/**
      - Cargo.lock
      - crates/harmonigraph-render/Cargo.toml
      - crates/harmonigraph-render/src/lattice_tests/metal_precompile.rs
      - crates/harmonigraph-render/src/shadow.rs
      - crates/harmonigraph-render/src/shaders/shadow.wgsl
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      HARMONIGRAPH_METAL_PROBE_DIR: ${{ github.workspace }}/target/metal-precompile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Export the production blur shader through Naga
        run: cargo test --locked --release -p harmonigraph-render --lib export_shadow_blur_metal -- --ignored --nocapture
      - name: Ensure Apple's compiler is available
        run: |
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Compile and verify the Metal libraries
        run: |
          python3 tools/metal-precompile/compile.py "$HARMONIGRAPH_METAL_PROBE_DIR"
          python3 tools/metal-precompile/compile.py "$HARMONIGRAPH_METAL_PROBE_DIR" --verify
      - uses: actions/upload-artifact@v4
        with:
          name: precompiled-shadow-blur
          path: target/metal-precompile/
          if-no-files-found: error
          retention-days: 7
