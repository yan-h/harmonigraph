# Cargo's normalized form of the published manifest, edited in place since
# the fork was pruned to what harmonigraph compiles on macOS (PATCHES.md).

# A workspace of its own, so `cargo test --manifest-path` reaches the unit
# tests this vendored copy carries (ci.sh runs them; `cargo test --workspace`
# cannot, because the crate is `exclude`d from the workspace above it and so is
# never a member whose tests run).
#
# What this earns is the WORKTREE case, and only that one. Cargo does not stop
# at the nearest ancestor workspace: a root whose `exclude` names this path is
# skipped and the walk goes on. From the main checkout the walk therefore ends
# there, at a root that excludes this crate, and the crate is accepted as its
# own — no table needed. From a worktree under `.claude/worktrees/` the walk
# skips the worktree's own root the same way and reaches the MAIN checkout's,
# whose `exclude` names `vendor/baseview` under a different prefix, so nothing
# excludes this path and cargo refuses outright. Which is where ci.sh runs.
[workspace]

[package]
edition = "2021"
rust-version = "1.80"
name = "baseview"
version = "0.1.4"
authors = [
    "William Light <git@wrl.lhiaudio.com>",
    "Charles Saracco <crsaracco@gmail.com>",
    "Mirko Covizzi <mrkcvzz@gmail.com>",
    "Micah Johnston <micah@glowcoil.com>",
    "Billy Messenger <billydm@protonmail.com>",
    "Anton Lazarev <https://antonok.com>",
    "Joakim Frostegård <joakim.frostegard@gmail.com>",
    "Robbert van der Helm <mail@robbertvanderhelm.nl>",
    "Adrien Prokopowicz <prokopylmc@gmail.com>",
]
build = false
exclude = [".github"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Low-level windowing system geared towards making audio plugin UIs."
readme = "README.md"
keywords = [
    "windowing",
    "audio",
    "plugin",
]
categories = ["gui"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustAudio/baseview"

[package.metadata.docs.rs]
all-features = true

[features]
default = []

[lib]
name = "baseview"
path = "src/lib.rs"

[dependencies.keyboard-types]
version = "0.6.1"
default-features = false

[dependencies.raw-window-handle]
version = "0.5"

[target.'cfg(target_os="macos")'.dependencies.block2]
version = "0.6.2"

[target.'cfg(target_os="macos")'.dependencies.objc2]
version = "0.6.4"

[target.'cfg(target_os="macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
features = [
    "NSApplication",
    "NSCursor",
    "NSDragging",
    "NSEvent",
    "NSGraphics",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
    "objc2-quartz-core",
]
default-features = false

[target.'cfg(target_os="macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
features = [
    "std",
    "CFString",
    "CFUUID",
    "block2",
    "objc2",
]
default-features = false

[target.'cfg(target_os="macos")'.dependencies.objc2-foundation]
version = "0.3.2"
features = [
    "std",
    "NSEnumerator",
    "block2",
    "NSOperation",
    "NSObjCRuntime",
    "NSRunLoop",
]
default-features = false

[target.'cfg(target_os="macos")'.dependencies.objc2-quartz-core]
version = "0.3.2"
features = [
    "std",
    "CABase",
    "CADisplayLink",
    "objc2-core-foundation",
]
default-features = false

[lints.clippy]
missing-safety-doc = "allow"
