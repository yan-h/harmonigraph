# A workspace of its own, for the reason `vendor/baseview/Cargo.toml` carries
# at more length: cargo skips an ancestor root whose `exclude` names this path
# and keeps walking, so from a worktree under `.claude/worktrees/` the walk
# passes the worktree's own root and reaches the MAIN checkout's, whose
# `exclude` entries resolve under a different prefix and so exclude nothing
# here. Without this table cargo refuses outright, and ci.sh runs `cargo test
# --manifest-path` against this crate from exactly there.
[workspace]

[package]
edition = "2024"
name = "egui-baseview"
version = "0.3.0"
authors = ["Billy Messenger <billydm@noreply.codeberg.org>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A baseview backend for egui"
readme = "README.md"
keywords = [
    "nice-plug",
    "plugin",
    "clap",
    "vst",
    "vst3",
]
categories = ["gui"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/RustAudio/egui-baseview"

[features]
default = [
    "opengl",
    "tracing",
]
keyboard_focus_workaround = []
nice-log = ["dep:nice-plug-core"]
opengl = [
    "dep:egui_glow",
    "baseview/opengl",
]
tracing = ["dep:tracing"]
wgpu = [
    "dep:egui-wgpu",
    "dep:raw-window-handle-06",
    "dep:pollster",
    "dep:wgpu",
]

[lib]
name = "egui_baseview"
path = "src/lib.rs"

[[example]]
name = "hello_world"
path = "examples/hello_world.rs"

[[example]]
name = "render_test"
path = "examples/render_test.rs"

[[example]]
name = "simple_demo"
path = "examples/simple_demo.rs"

[dependencies.baseview]
version = "0.1.4"

[dependencies.copypasta]
version = "0.10"
features = ["x11"]
default-features = false

[dependencies.egui]
version = "0.35.0"
features = ["bytemuck"]
default-features = false

[dependencies.egui-wgpu]
version = "0.35.0"
features = ["x11"]
optional = true

[dependencies.egui_glow]
version = "0.35.0"
features = ["x11"]
optional = true

[dependencies.keyboard-types]
version = "0.6"
default-features = false

[dependencies.nice-plug-core]
version = "0.1.3"
optional = true

[dependencies.open]
version = "5.3.3"

[dependencies.pollster]
version = "0.4.0"
optional = true

[dependencies.raw-window-handle]
version = "0.5"

[dependencies.raw-window-handle-06]
version = "0.6"
optional = true
package = "raw-window-handle"

[dependencies.thiserror]
version = "2"

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.wgpu]
version = "29"
optional = true

# The same objc2 generation wgpu-hal 29 builds against, so the
# `Retained<CAMetalLayer>` pulled out of `Surface::as_hal` in the wgpu
# renderer is the same type on both sides. Only used on macOS with the
# `wgpu` feature (src/renderer/wgpu/renderer.rs, `layer_present`).
[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
features = [
    "NSDictionary",
    "NSString",
    "NSNull",
    "NSObject",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-quartz-core]
version = "0.3"
features = [
    "CALayer",
    "CAMetalLayer",
]

[dev-dependencies.egui]
version = "0.35.0"
features = ["default_fonts"]
